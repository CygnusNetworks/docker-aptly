name: Docker Build and Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the Debian base image, aptly release and build recipe are unchanged
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/docker-build.yml

concurrency:
  group: docker-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEBIAN_IMAGE: debian:trixie-slim

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve latest aptly release
        id: aptly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api repos/aptly-dev/aptly/releases/latest)
          tag=$(jq -er .tag_name <<< "$release")
          version=${tag#v}
          # GitHub records a sha256 digest for every release asset; the release has no separate checksum file
          sha() {
            jq -er --arg n "aptly_${version}_linux_$1.zip" '.assets[] | select(.name == $n) | .digest | sub("^sha256:"; "")' <<< "$release"
          }
          echo "Building aptly $version"
          {
            echo "version=$version"
            echo "sha256_amd64=$(sha amd64)"
            echo "sha256_arm64=$(sha arm64)"
          } >> "$GITHUB_OUTPUT"

      - name: Compute registry image names (lowercase)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: bash scripts/registry-names.sh

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check upstream and published images
        id: decision
        env:
          APTLY_VERSION: ${{ steps.aptly.outputs.version }}
          FORCE_BUILD: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          image_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest' || true
          }

          BASE_DIGEST=$(docker buildx imagetools inspect "$DEBIAN_IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')
          BUILD_RECIPE=$(cat Dockerfile .github/workflows/docker-build.yml | sha256sum | cut -d ' ' -f 1)
          GHCR_LATEST_DIGEST=$(image_digest "$GHCR_IMAGE:latest")
          DOCKERHUB_LATEST_DIGEST=$(image_digest "$DOCKERHUB_REF:latest")
          GHCR_VERSION_DIGEST=$(image_digest "$GHCR_IMAGE:$APTLY_VERSION")
          DOCKERHUB_VERSION_DIGEST=$(image_digest "$DOCKERHUB_REF:$APTLY_VERSION")

          labels='{}'
          if [[ -n "$GHCR_LATEST_DIGEST" ]]; then
            labels=$(docker buildx imagetools inspect "$GHCR_IMAGE:latest" --format '{{json .Image}}' | jq -c '."linux/amd64".config.Labels // {}')
          fi
          label() {
            jq -r --arg key "$1" '.[$key] // ""' <<< "$labels"
          }
          PUBLISHED_BASE_DIGEST=$(label org.opencontainers.image.base.digest)
          PUBLISHED_APTLY_VERSION=$(label org.cygnusnetworks.aptly-version)
          PUBLISHED_BUILD_RECIPE=$(label org.cygnusnetworks.build-recipe)
          PUBLISHED_CREATED=$(label org.opencontainers.image.created)
          PUBLISHED_CREATED_EPOCH=$(date -u -d "${PUBLISHED_CREATED:-@0}" +%s 2>/dev/null || echo 0)

          {
            echo "base_digest=$BASE_DIGEST"
            echo "build_recipe=$BUILD_RECIPE"
          } >> "$GITHUB_OUTPUT"
          echo "Debian base: $BASE_DIGEST; aptly: $APTLY_VERSION; recipe: $BUILD_RECIPE; published: ${PUBLISHED_CREATED:-never}"
          export BASE_DIGEST BUILD_RECIPE GHCR_LATEST_DIGEST DOCKERHUB_LATEST_DIGEST GHCR_VERSION_DIGEST DOCKERHUB_VERSION_DIGEST
          export PUBLISHED_BASE_DIGEST PUBLISHED_APTLY_VERSION PUBLISHED_BUILD_RECIPE PUBLISHED_CREATED_EPOCH
          bash scripts/check-publish.sh

      - name: Extract metadata (tags, labels) for Docker
        if: steps.decision.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_REF }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.aptly.outputs.version }}

      - name: Build and push Docker image
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEBIAN_IMAGE=${{ env.DEBIAN_IMAGE }}@${{ steps.decision.outputs.base_digest }}
            BASE_DIGEST=${{ steps.decision.outputs.base_digest }}
            APTLY_VERSION=${{ steps.aptly.outputs.version }}
            APTLY_SHA256_AMD64=${{ steps.aptly.outputs.sha256_amd64 }}
            APTLY_SHA256_ARM64=${{ steps.aptly.outputs.sha256_arm64 }}
            BUILD_RECIPE=${{ steps.decision.outputs.build_recipe }}
            VCS_REF=${{ github.sha }}

      - name: Add missing GHCR version tag without rebuilding
        if: steps.decision.outputs.retag_ghcr == 'true'
        run: docker buildx imagetools create --tag "$GHCR_IMAGE:${{ steps.aptly.outputs.version }}" "$GHCR_IMAGE:latest"

      - name: Add missing Docker Hub version tag without rebuilding
        if: steps.decision.outputs.retag_dockerhub == 'true'
        run: docker buildx imagetools create --tag "$DOCKERHUB_REF:${{ steps.aptly.outputs.version }}" "$DOCKERHUB_REF:latest"

  keep-schedule-active:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable the workflow so GitHub does not suspend the schedule for inactivity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/docker-build.yml/enable"
